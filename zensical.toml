[project]
site_name = "doc2dash"
site_description = "Create docsets for Dash and other API browsers from intersphinx-compatible documentation."
site_author = "Hynek Schlawack"
site_url = "https://doc2dash.hynek.me/"

copyright = "Copyright &copy; 2012 Hynek Schlawack"

repo_url = "https://github.com/hynek/doc2dash"
repo_name = "hynek/doc2dash"
edit_uri = "edit/main/docs/"

# Custom fonts (Inter + Berkeley Mono).
extra_css = ["stylesheets/extra.css"]

nav = [
  { "About" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Installation" = "installation.md" },
  { "Supported Formats" = "formats.md" },
  { "Usage" = [
    { "CLI Reference" = "cli.md" },
    { "Building & Submitting Docsets" = "how-to.md" },
    { "Extending" = "extending.md" },
  ] },
  { "Meta" = [
    { "License & Credits" = "credits.md" },
    { "Changelog" = "https://github.com/hynek/doc2dash/blob/main/CHANGELOG.md" },
    { "Funding" = "https://hynek.me/say-thanks/" },
  ] },
]

[project.theme]
font = false
language = "en"
icon.repo = "fontawesome/brands/github"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/solid/person-circle-question"
link = "https://hynek.me/"

[[project.extra.social]]
icon = "fontawesome/brands/mastodon"
link = "https://mastodon.social/@hynek"

[[project.extra.social]]
icon = "fontawesome/brands/twitter"
link = "https://twitter.com/hynek"

[[project.extra.social]]
icon = "fontawesome/brands/github-alt"
link = "https://github.com/hynek"

# API reference is generated by mkdocstrings.
# https://zensical.org/docs/setup/extensions/mkdocstrings/
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
heading_level = 2


# ----------------------------------------------------------------------------
# Markdown extensions.
#
# Providing `markdown_extensions` REPLACES Zensical's built-in defaults (it does
# not merge), so we mirror Zensical's DEFAULT_MARKDOWN_EXTENSIONS here and add:
#
#   - smarty         -- typographic ("smart") quotes, dashes, and ellipses
#   - mkdocs-click   -- renders the Click CLI reference in cli.md
#   - github-callouts -- turns GitHub-style "> [!NOTE]" blocks into admonitions
#   - pymdownx.snippets -- includes sections of README.md into the docs
#
# Keep the mirrored defaults in sync with Zensical on upgrades.
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.smarty]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions."mkdocs-click"]
[project.markdown_extensions."github-callouts"]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid" }]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
