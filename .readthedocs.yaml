---
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.14"
  jobs:
    create_environment:
      # Need the tags to calculate the version.
      - git fetch --tags

      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest

      - uv venv
      - uv pip install -r requirements/docs.txt
      - uv pip install .

    build:
      html:
        # Set canonical URL for the version that's being built.
        - sed -i "s|https://doc2dash.hynek.me/|$READTHEDOCS_CANONICAL_URL|g" zensical.toml
        - .venv/bin/zensical build
        # Zensical builds into site/; hand it to Read the Docs.
        # https://docs.readthedocs.com/platform/latest/intro/zensical.html
        - mkdir -p $READTHEDOCS_OUTPUT/html/
        - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
